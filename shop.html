<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Entrepreneurship Hub</title>

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            color:#333;
        }

        /* HEADER */
        header{
            background:#004080;
            color:white;
            padding:15px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo-section{
            display:flex;
            align-items:center;
        }

        .logo-section img{
            width:60px;
            margin-right:15px;
        }

        /* NAVIGATION */
        nav ul{
            list-style:none;
            display:flex;
        }

        nav ul li{
            margin-left:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:white;
            font-weight:bold;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:#ffcc00;
        }

        /* HERO SECTION */
        .hero{
            height:80vh;
            background:linear-gradient(rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)),
            url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d')
            center/cover no-repeat;

            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            color:white;
            padding:20px;
        }

        .hero-content h1{
            font-size:3rem;
            margin-bottom:20px;
        }

        .hero-content p{
            font-size:1.2rem;
            margin-bottom:25px;
        }

        .btn{
            background:#ffcc00;
            color:#000;
            padding:12px 25px;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:white;
        }

        /* SLIDESHOW */
        .slideshow-container{
            width:90%;
            max-width:1000px;
            margin:50px auto;
            position:relative;
            overflow:hidden;
            border-radius:10px;
            box-shadow:0 4px 8px rgba(0,0,0,0.3);
        }

        .slide{
            display:none;
        }

        .slide img{
            width:100%;
            height:500px;
            object-fit:cover;
        }

        /* FOOTER */
        footer{
            background:#00264d;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

        .social-icons{
            margin-top:10px;
        }

        .social-icons a{
            color:white;
            margin:0 10px;
            font-size:22px;
            transition:0.3s;
        }

        .social-icons a:hover{
            color:#ffcc00;
        }

        /* RESPONSIVE */
        @media(max-width:768px){

            header{
                flex-direction:column;
            }

            nav ul{
                margin-top:15px;
                flex-direction:column;
                align-items:center;
            }

            nav ul li{
                margin:10px 0;
            }

            .hero-content h1{
                font-size:2rem;
            }

            .slide img{
                height:300px;
            }
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-section">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="College Logo">
            <h2>Kenya Youth Entrepreneurship College</h2>
        </div>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Opportunities</a></li>
                <li><a href="#">Mentors</a></li>
                <li><a href="#">Apply</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Empowering Young Entrepreneurs in Kenya</h1>
            <p>Learn, Innovate, and Build Your Future Today.</p>
            <a href="#" class="btn">Apply Now</a>
        </div>
    </section>

    <!-- SLIDESHOW -->
    <section>
        <div class="slideshow-container">

            <div class="slide">
                <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
                alt="Entrepreneurship Image 1">
            </div>

            <div class="slide">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
                alt="Entrepreneurship Image 2">
            </div>

            <div class="slide">
                <img src="https://images.unsplash.com/photo-1552664730-d307ca884978"
                alt="Entrepreneurship Image 3">
            </div>

            <div class="slide">
                <img src="https://images.unsplash.com/photo-1521791136064-7986c2920216"
                alt="Entrepreneurship Image 4">
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Kenya Youth Entrepreneurship College. All Rights Reserved.</p>

        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
    </footer>

    <!-- JAVASCRIPT SLIDESHOW -->
    <script>

        let slideIndex = 0;
        showSlides();

        function showSlides(){

            let slides = document.getElementsByClassName("slide");

            for(let i = 0; i < slides.length; i++){
                slides[i].style.display = "none";
            }

            slideIndex++;

            if(slideIndex > slides.length){
                slideIndex = 1;
            }

            slides[slideIndex - 1].style.display = "block";

            setTimeout(showSlides, 3000);
        }

    </script>

</body>
</html>
